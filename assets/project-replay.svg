<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Replay</title>
  <desc id="d">Tarjeta del proyecto: tienda de vinilos y cassettes con catálogo desde la API de Discogs, con la ilustración de un vinilo girando.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ffb84d" stop-opacity=".2"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#5b2bd9"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#d9412b"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2de2e6"/><stop offset="1" stop-color="#1b5fd9"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#0f7a5f"/></linearGradient>
    <clipPath id="frame"><rect width="900" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .disc { animation: spin 4s linear infinite; transform-origin: 124px 136px; }
    .arm { animation: arm 8s ease-in-out infinite; transform-origin: 266px 40px; }
    .eq rect { animation: eq 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .eq rect:nth-child(2) { animation-delay: -.3s; } .eq rect:nth-child(3) { animation-delay: -.6s; }
    .eq rect:nth-child(4) { animation-delay: -.15s; } .eq rect:nth-child(5) { animation-delay: -.8s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes arm { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(26deg); } }
    @keyframes eq { 50% { transform: scaleY(.35); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .arm { transform: rotate(22deg); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="#0d0a06"/>
    <circle cx="690" cy="170" r="270" fill="url(#aura)"/>
    <rect width="900" height="4" fill="url(#top)"/>

    <text class="mono" x="40" y="54" font-size="15" letter-spacing="2" fill="#ffb84d">03 · TRABAJO EN EQUIPO</text>
    <text class="sans" x="40" y="108" font-size="40" font-weight="800" fill="#fff6e8">Replay</text>
    <g class="sans" font-size="21" fill="#f0dcbf">
      <text x="40" y="150">Tienda de vinilos y cassettes</text>
      <text x="40" y="179">con catálogo en vivo desde</text>
      <text x="40" y="208">la API de Discogs.</text>
    </g>
    <g class="mono" font-size="14" text-anchor="middle" fill="#ffd9a0">
      <g fill="none" stroke="#ffb84d" stroke-opacity=".55">
        <rect x="40" y="238" width="68" height="30" rx="15"/><rect x="116" y="238" width="60" height="30" rx="15"/><rect x="184" y="238" width="116" height="30" rx="15"/>
      </g>
      <text x="74" y="258">React</text><text x="146" y="258">Vite</text><text x="242" y="258">Discogs API</text>
    </g>

    <g transform="translate(476 34)">
      <rect width="392" height="272" rx="14" fill="#16100a" stroke="#ffb84d" stroke-opacity=".5"/>
      <g class="disc">
        <circle cx="124" cy="136" r="104" fill="#0a0806"/>
        <g fill="none" stroke="#3a2f22"><circle cx="124" cy="136" r="94"/><circle cx="124" cy="136" r="84"/><circle cx="124" cy="136" r="74"/><circle cx="124" cy="136" r="64"/><circle cx="124" cy="136" r="54"/></g>
        <path d="M124 136 L60 50 A104 104 0 0 1 124 32 Z" fill="#ffb84d" opacity=".1"/>
        <path d="M124 136 L188 222 A104 104 0 0 1 124 240 Z" fill="#ffb84d" opacity=".1"/>
        <circle cx="124" cy="136" r="38" fill="url(#c2)"/>
        <circle cx="152" cy="136" r="5" fill="#fff6e8" opacity=".7"/>
        <circle cx="124" cy="136" r="6" fill="#16100a"/>
      </g>
      <g class="arm">
        <circle cx="266" cy="40" r="11" fill="#40362a" stroke="#ffb84d" stroke-opacity=".6"/>
        <path d="M266 40 L252 150 L226 186" fill="none" stroke="#d8c6a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="214" y="180" width="18" height="11" rx="2.5" transform="rotate(-50 223 185)" fill="#ffb84d"/>
      </g>
      <g>
        <rect x="290" y="82" width="42" height="42" rx="5" fill="url(#c1)"/><rect x="338" y="82" width="42" height="42" rx="5" fill="url(#c3)"/>
        <rect x="290" y="130" width="42" height="42" rx="5" fill="url(#c4)"/><rect x="338" y="130" width="42" height="42" rx="5" fill="url(#c2)"/>
      </g>
      <g class="eq" fill="#ffb84d">
        <rect x="296" y="196" width="10" height="56" rx="3"/><rect x="312" y="196" width="10" height="56" rx="3"/><rect x="328" y="196" width="10" height="56" rx="3"/><rect x="344" y="196" width="10" height="56" rx="3"/><rect x="360" y="196" width="10" height="56" rx="3"/>
      </g>
    </g>
  </g>
</svg>
