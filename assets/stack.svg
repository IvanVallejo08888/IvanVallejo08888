      <g fill="#0e2018" stroke="#2de2e6" stroke-opacity=".45"><rect x="126" width="170" height="46" rx="10"/><rect x="306" width="170" height="46" rx="10"/><rect x="486" width="170" height="46" rx="10"/><rect x="666" width="170" height="46" rx="10"/></g>
      <g fill="#e8fff2"><text x="211" y="29">Java</text><text x="391" y="29">Jakarta EE</text><text x="571" y="29">Tomcat 10</text><text x="751" y="29">API Routes</text></g>
    </g>
