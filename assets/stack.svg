<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" width="900" height="276" role="img" aria-labelledby="t d">
  <title id="t">Stack tecnológico</title>
  <desc id="d">Frontend: Next.js, React, TypeScript, Tailwind CSS. Backend: Java, Jakarta EE, Tomcat 10, API Routes. Datos: PostgreSQL, Neon, Drizzle ORM, Supabase. Entrega: Vercel, GitHub, PWA, Vitest.</desc>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .row { animation: slide .8s ease-out both; }
    .row:nth-of-type(2) { animation-delay: .15s; } .row:nth-of-type(3) { animation-delay: .3s; } .row:nth-of-type(4) { animation-delay: .45s; }
    .led { animation: blink 2.4s ease-in-out infinite; }
    @keyframes slide { from { opacity: 0; transform: translateX(-16px); } }
    @keyframes blink { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
