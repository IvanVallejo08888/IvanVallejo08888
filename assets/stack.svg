      <g fill="#0e2018" stroke="#ffb84d" stroke-opacity=".45"><rect x="126" width="170" height="46" rx="10"/><rect x="306" width="170" height="46" rx="10"/><rect x="486" width="170" height="46" rx="10"/><rect x="666" width="170" height="46" rx="10"/></g>
      <g fill="#e8fff2"><text x="211" y="29">PostgreSQL</text><text x="391" y="29">Neon</text><text x="571" y="29">Drizzle ORM</text><text x="751" y="29">Supabase</text></g>
