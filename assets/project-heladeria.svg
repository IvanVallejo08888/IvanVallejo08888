<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Heladería Antojos</title>
  <desc id="d">Tarjeta del proyecto: sistema de facturación, cocina, despacho, caja y domicilios en tiempo real, con una ilustración de un tablero de pedidos animado.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#2de2e6"/><stop offset="1" stop-color="#39ff88"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#2de2e6" stop-opacity=".2"/><stop offset="1" stop-color="#2de2e6" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="900" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .order { animation: travel 8s cubic-bezier(.7, 0, .3, 1) infinite; }
    .live { animation: blink 1.4s ease-in-out infinite; }
    .ping { animation: ping 8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel { 0%, 22% { transform: translate(0, 0); } 36%, 58% { transform: translate(119px, 0); } 72%, 92% { transform: translate(238px, 0); } 100% { transform: translate(238px, 0); opacity: 0; } }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes ping { 0%, 70% { opacity: 0; transform: scale(.6); } 74% { opacity: 1; } 90%, 100% { opacity: 0; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ping { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="#050d09"/>
    <circle cx="690" cy="170" r="270" fill="url(#aura)"/>
    <rect width="900" height="4" fill="url(#top)"/>

    <text class="mono" x="40" y="54" font-size="15" letter-spacing="2" fill="#2de2e6">01 · DESPLEGADO EN VERCEL</text>
    <text class="sans" x="40" y="108" font-size="40" font-weight="800" fill="#f0fff7">Heladería Antojos</text>
    <g class="sans" font-size="21" fill="#c6efd6">
      <text x="40" y="150">Facturación, cocina, despacho,</text>
      <text x="40" y="179">caja y domicilios en una sola</text>
      <text x="40" y="208">app en tiempo real.</text>
    </g>
    <g class="mono" font-size="14" text-anchor="middle" fill="#a6f6f7">
      <g fill="none" stroke="#2de2e6" stroke-opacity=".5">
        <rect x="40" y="238" width="104" height="30" rx="15"/><rect x="152" y="238" width="104" height="30" rx="15"/><rect x="264" y="238" width="64" height="30" rx="15"/><rect x="336" y="238" width="84" height="30" rx="15"/>
        <rect x="40" y="276" width="76" height="30" rx="15"/><rect x="124" y="276" width="84" height="30" rx="15"/><rect x="216" y="276" width="76" height="30" rx="15"/>
      </g>
      <text x="92" y="258">Next.js 14</text><text x="204" y="258">TypeScript</text><text x="296" y="258">Neon</text><text x="378" y="258">Drizzle</text>
      <text x="78" y="296">Pusher</text><text x="166" y="296">Zustand</text><text x="254" y="296">Vitest</text>
    </g>

    <g transform="translate(476 34)">
      <rect width="392" height="272" rx="14" fill="#0a1610" stroke="#2de2e6" stroke-opacity=".5"/>
      <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/><circle cx="35" cy="20" r="4.5" fill="#febc2e"/><circle cx="50" cy="20" r="4.5" fill="#28c840"/>
      <circle class="live" cx="310" cy="20" r="5" fill="#39ff88"/>
      <text class="mono" x="322" y="25" font-size="14" fill="#a6ffcb">en vivo</text>

      <g fill="#0e2018" stroke="#1d4a33">
        <rect x="14" y="40" width="112" height="218" rx="9"/><rect x="133" y="40" width="112" height="218" rx="9"/><rect x="252" y="40" width="126" height="218" rx="9"/>
      </g>
      <g class="sans" font-size="15" font-weight="700" fill="#a9d4bb" text-anchor="middle">
        <text x="70" y="64">Nuevo</text><text x="189" y="64">Cocina</text><text x="315" y="64">Listo</text>
      </g>
      <g fill="#14302a">
        <rect x="24" y="142" width="92" height="52" rx="7"/><rect x="24" y="200" width="92" height="46" rx="7"/>
        <rect x="143" y="76" width="92" height="52" rx="7"/><rect x="143" y="142" width="92" height="52" rx="7"/>
        <rect x="262" y="142" width="106" height="52" rx="7"/><rect x="262" y="200" width="106" height="46" rx="7"/>
      </g>
      <g fill="#3f6a5a">
        <rect x="34" y="154" width="58" height="7" rx="3.5"/><rect x="34" y="170" width="38" height="7" rx="3.5"/>
        <rect x="34" y="212" width="50" height="7" rx="3.5"/><rect x="34" y="226" width="30" height="7" rx="3.5"/>
        <rect x="153" y="88" width="56" height="7" rx="3.5"/><rect x="153" y="104" width="40" height="7" rx="3.5"/>
        <rect x="153" y="154" width="48" height="7" rx="3.5"/><rect x="153" y="170" width="60" height="7" rx="3.5"/>
        <rect x="272" y="154" width="66" height="7" rx="3.5"/><rect x="272" y="170" width="42" height="7" rx="3.5"/>
        <rect x="272" y="212" width="54" height="7" rx="3.5"/><rect x="272" y="226" width="34" height="7" rx="3.5"/>
      </g>
      <rect class="ping" x="262" y="76" width="106" height="52" rx="7" fill="none" stroke="#39ff88" stroke-width="2"/>
      <g class="order">
        <rect x="24" y="76" width="92" height="52" rx="7" fill="#123f44" stroke="#2de2e6" stroke-width="1.6"/>
        <rect x="34" y="88" width="60" height="7" rx="3.5" fill="#2de2e6"/>
        <rect x="34" y="104" width="38" height="7" rx="3.5" fill="#a6f6f7"/>
      </g>
    </g>
  </g>
</svg>
