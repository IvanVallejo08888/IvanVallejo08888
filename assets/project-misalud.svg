<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">MiSalud</title>
  <desc id="d">Tarjeta del proyecto: gestión de citas médicas, doctores y usuarios en Java, con la ilustración de un calendario y una línea de pulso animada.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#2de2e6"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#5cc8ff" stop-opacity=".2"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="900" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .ecg { stroke-dasharray: 150 480; animation: run 2.6s linear infinite; }
    .slot { animation: blink 2s ease-in-out infinite; }
    .beat { animation: beat 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes run { from { stroke-dashoffset: 630; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: .35; } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.16); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 56% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ecg { stroke-dasharray: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="#050b10"/>
    <circle cx="690" cy="170" r="270" fill="url(#aura)"/>
    <rect width="900" height="4" fill="url(#top)"/>

    <text class="mono" x="40" y="54" font-size="15" letter-spacing="2" fill="#5cc8ff">04 · SALUD DIGITAL</text>
    <text class="sans" x="40" y="108" font-size="40" font-weight="800" fill="#eef8ff">MiSalud</text>
    <g class="sans" font-size="21" fill="#c4e4f5">
      <text x="40" y="150">Citas médicas, doctores y</text>
      <text x="40" y="179">usuarios, construido sobre</text>
      <text x="40" y="208">Java y Jakarta EE.</text>
    </g>
    <g class="mono" font-size="14" text-anchor="middle" fill="#bfe8ff">
      <g fill="none" stroke="#5cc8ff" stroke-opacity=".55">
        <rect x="40" y="238" width="60" height="30" rx="15"/><rect x="108" y="238" width="104" height="30" rx="15"/><rect x="220" y="238" width="92" height="30" rx="15"/>
      </g>
      <text x="70" y="258">Java</text><text x="160" y="258">Jakarta EE</text><text x="266" y="258">Servlets</text>
    </g>

    <g transform="translate(476 34)">
      <rect width="392" height="272" rx="14" fill="#0a131b" stroke="#5cc8ff" stroke-opacity=".5"/>

      <g fill="#10202c" stroke="#1f3f55">
        <rect x="16" y="16" width="44" height="40" rx="7"/><rect x="66" y="16" width="44" height="40" rx="7"/><rect x="116" y="16" width="44" height="40" rx="7"/><rect x="166" y="16" width="44" height="40" rx="7"/><rect x="216" y="16" width="44" height="40" rx="7"/>
        <rect x="16" y="62" width="44" height="40" rx="7"/><rect x="66" y="62" width="44" height="40" rx="7"/><rect x="116" y="62" width="44" height="40" rx="7"/><rect x="166" y="62" width="44" height="40" rx="7"/><rect x="216" y="62" width="44" height="40" rx="7"/>
        <rect x="16" y="108" width="44" height="40" rx="7"/><rect x="66" y="108" width="44" height="40" rx="7"/><rect x="116" y="108" width="44" height="40" rx="7"/><rect x="166" y="108" width="44" height="40" rx="7"/><rect x="216" y="108" width="44" height="40" rx="7"/>
      </g>
      <rect class="slot" x="116" y="62" width="44" height="40" rx="7" fill="#5cc8ff"/>
      <rect x="66" y="16" width="44" height="40" rx="7" fill="#1d4a66"/>
      <rect x="216" y="108" width="44" height="40" rx="7" fill="#1d4a66"/>

      <rect x="272" y="16" width="104" height="132" rx="9" fill="#10202c" stroke="#1f3f55"/>
      <circle cx="324" cy="50" r="19" fill="#1d4a66"/>
      <g class="beat"><path d="M324 60 C312 51 310 47 310 43 C310 37 319 35 324 42 C329 35 338 37 338 43 C338 47 336 51 324 60 Z" fill="#ff5f7e"/></g>
      <rect x="288" y="84" width="72" height="7" rx="3.5" fill="#4b7a96"/><rect x="296" y="100" width="56" height="7" rx="3.5" fill="#2e5570"/><rect x="288" y="122" width="72" height="14" rx="7" fill="#5cc8ff"/>

      <rect x="16" y="160" width="360" height="96" rx="9" fill="#10202c" stroke="#1f3f55"/>
      <path d="M26 208H96L108 208L118 186L132 240L146 168L158 222L168 208H240L252 208L262 186L276 240L290 168L302 222L312 208H366" fill="none" stroke="#1f3f55" stroke-width="2" stroke-linejoin="round"/>
      <path class="ecg" d="M26 208H96L108 208L118 186L132 240L146 168L158 222L168 208H240L252 208L262 186L276 240L290 168L302 222L312 208H366" fill="none" stroke="#2de2e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
