<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">Ivan Vallejo, desarrollador full stack</title>
  <desc id="d">Banner animado en negro y verde neón con el nombre Ivan Vallejo y una terminal que escribe frases sobre su trabajo.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#39ff88" stroke-opacity=".13"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="900" height="400" fill="url(#fade)"/></mask>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39ff88" stop-opacity=".34"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eafff3"/>
      <stop offset=".5" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39ff88" stop-opacity=".14"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="400" rx="22"/></clipPath>
    <clipPath id="typed"><rect x="150" y="306" width="620" height="44"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .gridLayer { animation: drift 9s linear infinite; }
    .aura { animation: breathe 5s ease-in-out infinite; transform-origin: 450px 180px; }
    .scan { animation: sweep 7s linear infinite; }
    .ghostA { animation: glitchA 6s steps(1) infinite; }
    .ghostB { animation: glitchB 6s steps(1) infinite; }
    .dot { animation: floaty 7s ease-in-out infinite; }
    .dot:nth-of-type(2n) { animation-duration: 9s; animation-delay: -3s; }
    .dot:nth-of-type(3n) { animation-duration: 11s; animation-delay: -6s; }
    .live { animation: blink 1.6s ease-in-out infinite; }
    .p1 { animation: show1 12s linear infinite; }
    .p2 { animation: show2 12s linear infinite; }
    .p3 { animation: show3 12s linear infinite; }
    .c1 { animation: type1 12s infinite; }
    .c2 { animation: type2 12s infinite; }
    .c3 { animation: type3 12s infinite; }
    @keyframes drift { to { transform: translateY(36px); } }
    @keyframes breathe { 50% { transform: scale(1.14); opacity: .72; } }
    @keyframes sweep { from { transform: translateY(-120px); } to { transform: translateY(420px); } }
    @keyframes floaty { 50% { transform: translateY(-16px); opacity: .25; } }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes glitchA { 0%, 91%, 94%, 100% { opacity: 0; transform: none; } 92% { opacity: .75; transform: translate(-5px, 2px); } 93% { opacity: .75; transform: translate(4px, -2px); } }
    @keyframes glitchB { 0%, 91%, 94%, 100% { opacity: 0; transform: none; } 92% { opacity: .75; transform: translate(5px, -2px); } 93% { opacity: .75; transform: translate(-4px, 2px); } }
    @keyframes show1 { 0%, 32.9% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 33% { opacity: 0; } 33.1%, 66% { opacity: 1; } 66.1%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 66.2% { opacity: 0; } 66.3%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type1 { 0% { transform: translateX(0); animation-timing-function: steps(35, end); } 16%, 33% { transform: translateX(455px); } 100% { transform: translateX(455px); } }
    @keyframes type2 { 0%, 33.3% { transform: translateX(0); animation-timing-function: steps(33, end); } 49%, 100% { transform: translateX(429px); } }
    @keyframes type3 { 0%, 66.6% { transform: translateX(0); animation-timing-function: steps(29, end); } 81%, 100% { transform: translateX(377px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ghostA, .ghostB, .p2, .p3 { opacity: 0; } .c1 { transform: translateX(455px); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="400" fill="#050d09"/>
    <g mask="url(#gridMask)"><rect class="gridLayer" y="-36" width="900" height="472" fill="url(#grid)"/></g>
    <ellipse class="aura" cx="450" cy="180" rx="400" ry="170" fill="url(#aura)"/>

    <g fill="#39ff88">
      <circle class="dot" cx="84" cy="96" r="2.5" opacity=".7"/>
      <circle class="dot" cx="168" cy="250" r="2" opacity=".5"/>
      <circle class="dot" cx="262" cy="62" r="1.8" opacity=".6"/>
      <circle class="dot" cx="640" cy="54" r="2.4" opacity=".6"/>
      <circle class="dot" cx="742" cy="232" r="2" opacity=".5"/>
      <circle class="dot" cx="826" cy="104" r="2.6" opacity=".7"/>
    </g>

    <g transform="translate(450 64)">
      <rect x="-188" y="-19" width="376" height="38" rx="19" fill="#0b1a12" stroke="#39ff88" stroke-opacity=".45"/>
      <circle class="live" cx="-164" cy="0" r="5" fill="#39ff88"/>
      <text class="mono" x="10" y="5.5" text-anchor="middle" font-size="15" letter-spacing="2" fill="#a6ffcb">ESTUDIANTE · FULL STACK DEV</text>
    </g>

    <g class="sans" font-size="88" font-weight="800" text-anchor="middle">
      <text class="ghostA" x="450" y="170" textLength="640" fill="#2de2e6">IVAN VALLEJO</text>
      <text class="ghostB" x="450" y="170" textLength="640" fill="#ff4fa3">IVAN VALLEJO</text>
      <text x="450" y="170" textLength="640" fill="url(#nameFill)" filter="url(#glow)">IVAN VALLEJO</text>
    </g>

    <text class="sans" x="450" y="222" text-anchor="middle" font-size="22" fill="#c6efd6">Construyo aplicaciones web completas · Colombia</text>
    <text class="mono" x="450" y="256" text-anchor="middle" font-size="16" letter-spacing="1" fill="#6fa487">Java  ·  Next.js  ·  TypeScript  ·  PostgreSQL</text>

    <rect x="110" y="288" width="680" height="76" rx="14" fill="#0a1610" stroke="#39ff88" stroke-opacity=".35"/>
    <circle cx="132" cy="304" r="4" fill="#ff5f57"/><circle cx="146" cy="304" r="4" fill="#febc2e"/><circle cx="160" cy="304" r="4" fill="#28c840"/>
    <g class="mono" font-size="22">
      <text x="130" y="343" fill="#39ff88">&gt;</text>
      <g clip-path="url(#typed)">
        <g class="p1">
          <text x="156" y="343" textLength="455" fill="#eafff3">facturación, inventario y logística</text>
          <g class="c1"><rect x="156" y="318" width="640" height="34" fill="#0a1610"/><rect x="157" y="322" width="11" height="26" fill="#39ff88"/></g>
        </g>
        <g class="p2">
          <text x="156" y="343" textLength="429" fill="#eafff3">de la base de datos a la pantalla</text>
          <g class="c2"><rect x="156" y="318" width="640" height="34" fill="#0a1610"/><rect x="157" y="322" width="11" height="26" fill="#39ff88"/></g>
        </g>
        <g class="p3">
          <text x="156" y="343" textLength="377" fill="#eafff3">software que se usa de verdad</text>
          <g class="c3"><rect x="156" y="318" width="640" height="34" fill="#0a1610"/><rect x="157" y="322" width="11" height="26" fill="#39ff88"/></g>
        </g>
      </g>
    </g>

    <rect class="scan" width="900" height="110" fill="url(#scan)"/>
    <rect x=".75" y=".75" width="898.5" height="398.5" rx="21.5" fill="none" stroke="#39ff88" stroke-opacity=".32" stroke-width="1.5"/>
  </g>
</svg>
