<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Área 17</title>
  <desc id="d">Tarjeta del proyecto: sistema de gestión empresarial con inventario, ventas, gastos y reportes, con una ilustración de un panel con gráficas animadas.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#b6ff5c"/></linearGradient>
    <linearGradient id="barFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#127a43"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#39ff88" stop-opacity=".2"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="900" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .b { animation: grow 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .b:nth-of-type(2) { animation-delay: .25s; } .b:nth-of-type(3) { animation-delay: .5s; }
    .b:nth-of-type(4) { animation-delay: .75s; } .b:nth-of-type(5) { animation-delay: 1s; }
    .b:nth-of-type(6) { animation-delay: 1.25s; } .b:nth-of-type(7) { animation-delay: 1.5s; }
    .trend { stroke-dasharray: 300; animation: draw 5s ease-in-out infinite; }
    .laser { animation: laser 3s ease-in-out infinite; }
    @keyframes grow { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    @keyframes draw { 0% { stroke-dashoffset: 300; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes laser { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(122px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="#050d09"/>
    <circle cx="690" cy="170" r="270" fill="url(#aura)"/>
    <rect width="900" height="4" fill="url(#top)"/>

    <text class="mono" x="40" y="54" font-size="15" letter-spacing="2" fill="#39ff88">02 · GESTIÓN EMPRESARIAL</text>
    <text class="sans" x="40" y="108" font-size="40" font-weight="800" fill="#f0fff7">Área 17</text>
    <g class="sans" font-size="21" fill="#c6efd6">
      <text x="40" y="150">Inventario, ventas, gastos y</text>
      <text x="40" y="179">reportes. Nació en Java y</text>
      <text x="40" y="208">evolucionó a una PWA en Next.js.</text>
    </g>
    <g class="mono" font-size="14" text-anchor="middle" fill="#a6ffcb">
